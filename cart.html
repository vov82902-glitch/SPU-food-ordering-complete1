<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPU Food • ตะกร้า</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <header class="site-header">
        <div class="bar">
            <a class="brand" href="floors.html">
                <span class="brand-mark">SPU</span>
                <span class="brand-text"><b>SPU Food</b><small>ระบบสั่งอาหารออนไลน์</small></span>
            </a>
            <nav class="nav">
                <a href="floors.html">เลือกชั้น</a>
                <a href="cart.html" class="active">ตะกร้า <span id="cart-count" class="count">0</span></a>
                <a href="queue.html">คิวของฉัน</a>
                <a href="profile.html">ข้อมูลของฉัน</a>
                <button onclick="logout()">ออกจากระบบ</button>
            </nav>
        </div>
    </header>
    <ol class="steps">
        <li class="done"><span>✓</span>เลือกชั้น</li>
        <li class="done"><span>✓</span>เลือกร้าน</li>
        <li class="done"><span>✓</span>เลือกเมนู</li>
        <li class="now"><span>4</span>ยืนยันสั่ง</li>
        <li><span>5</span>รับคิว</li>
    </ol>
    <main class="content">
        <div class="page-head">
            <h2>ตะกร้า</h2>
            <p>ตรวจสอบรายการก่อนยืนยันสั่ง</p>
        </div>
        <div id="cart-list"></div>
        <!-- ถ้าสั่งไม่ได้ (โดนพัก / ค้างรับเยอะ) จะขึ้นข้อความตรงนี้ (cart.js) -->
        <p id="block-note" class="block-note" hidden></p>
        <div class="summary">
            <div>
                <p class="total-line">ยอดรวม <span id="total">0</span> บาท</p>
                <p class="muted">💵 จ่ายเงินสดที่ร้านตอนรับอาหาร</p>
            </div>
            <button id="order-button" onclick="placeOrder()">ยืนยันสั่งอาหาร</button>
        </div>
    </main>
    <!-- แผ่นเลือก "ถ้าของหมด จะให้ทำยังไง?" (ควบคุมด้วย if-out.js) -->
    <div id="ifout-sheet" class="dialog sheet" hidden>
        <div class="dialog-box sheet-box" role="dialog" aria-modal="true" aria-labelledby="ifout-title">
            <div class="sheet-head">
                <div>
                    <h3 id="ifout-title">ถ้าของหมด จะให้ทำยังไง?</h3>
                    <p id="ifout-dish"></p>
                </div>
                <button type="button" id="ifout-close" class="sheet-close" aria-label="ปิด">✕</button>
            </div>
            <div id="ifout-list"></div>
            <div class="sheet-foot">
                <button type="button" id="ifout-save" class="btn-save">บันทึก</button>
            </div>
        </div>
    </div>
    <footer class="site-footer"><b>SPU Food Ordering</b> · จ่ายเงินสดที่ร้าน</footer>
    <script src="assets/js/cloud.js" data-load="assets/js/main.js assets/js/noshow.js assets/js/if-out.js assets/js/cart.js"></script>
</body>
</html>

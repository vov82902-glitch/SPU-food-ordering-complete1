<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPU Food • เมนูอาหาร</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <header class="site-header">
        <div class="bar">
            <a class="brand" href="floors.html">
                <span class="brand-mark">SPU</span>
                <span class="brand-text"><b>SPU Food</b><small>ระบบสั่งอาหารออนไลน์</small></span>
            </a>
            <nav class="nav">
                <a href="floors.html" class="active">เลือกชั้น</a>
                <a href="cart.html">ตะกร้า <span id="cart-count" class="count">0</span></a>
                <a href="queue.html">คิวของฉัน</a>
                <a href="profile.html">ข้อมูลของฉัน</a>
                <button onclick="logout()">ออกจากระบบ</button>
            </nav>
        </div>
    </header>
    <ol class="steps">
        <li class="done"><span>✓</span>เลือกชั้น</li>
        <li class="done"><span>✓</span>เลือกร้าน</li>
        <li class="now"><span>3</span>เลือกเมนู</li>
        <li><span>4</span>ยืนยันสั่ง</li>
        <li><span>5</span>รับคิว</li>
    </ol>
    <main class="content">
        <a id="back-link" href="floors.html">← กลับไปเลือกร้าน</a>
        <div class="page-head">
            <h2 id="store-name">เมนูอาหาร</h2>
        </div>
        <div id="menu-list"></div>
    </main>

    <!-- หน้าต่างเลือกตัวเลือกเมนู (ควบคุมด้วย menu-options.js) -->
    <div id="options-dialog" class="dialog" hidden>
        <form id="options-form" class="dialog-box options-box" role="dialog" aria-modal="true" aria-labelledby="options-title" novalidate>
            <h3 id="options-title">ชื่อเมนู</h3>
            <p id="options-base">ราคาเริ่มต้น</p>
            <div id="options-groups"></div>
            <label for="options-note" class="options-note-label">หมายเหตุ</label>
            <textarea id="options-note" maxlength="200" placeholder="เช่น ไม่ใส่ถั่วฝักยาว"></textarea>
            <p id="options-error" class="field-error" role="alert"></p>
            <div class="dialog-actions">
                <button type="button" class="btn-plain" id="options-cancel">ยกเลิก</button>
                <button type="submit" class="btn-add" id="options-add">เพิ่มลงตะกร้า</button>
            </div>
        </form>
    </div>
    <footer class="site-footer"><b>SPU Food Ordering</b> · รับชำระเงินสดและ QR พร้อมเพย์</footer>
    <script src="assets/js/cloud.js" data-load="assets/js/main.js assets/js/menu-options.js assets/js/menu.js"></script>
</body>
</html>
